[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "procureguard-ai"
version = "0.1.0"
description = "MCP procurement prototype: negotiation copilot and fraud risk detection"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2,<3",
  "pymysql>=1,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["backend*"]
